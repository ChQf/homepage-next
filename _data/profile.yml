short_bio: >-
  <p>
    I joined the College of Electrical Engineering and Automation, Fuzhou University, China, in 2026.
    Previously, I was a Postdoctoral Fellow at The Hong Kong Polytechnic University, collaborating with Prof.
    <a href="https://www.polyu.edu.hk/eee/people/academic-staff-and-teaching-staff/prof-bu-siqi/" target="_blank">Prof. Siqi BU</a>
    from 2025 to 2026.
    I received my Ph.D. degree in Electrical Engineering from The Hong Kong Polytechnic University in 2025, under the supervision of 
    <a href="https://www.polyu.edu.hk/eee/people/academic-staff-and-teaching-staff/prof-bu-siqi/" target="_blank">Prof. Siqi BU</a>
    (FIET) at the 
    <a href="https://www.polyu.edu.hk/rcgm/?sc_lang=en" target="_blank">Research Centre for Grid Modernisation</a> and
    <a href="https://www.polyu.edu.hk/eee/people/academic-staff-and-teaching-staff/prof-bu-siqi/" target="_blank">RISA research lab</a>.
    I received my M.Eng. degree in Power System & Automation and 
    B.Eng. degree in Electrical Engineering & Automation both from Fuzhou University, China, in 2021 and 2018, respectively. 
    I was a visiting Ph.D. student at National University of Singapore in 2024, under the supervision of Prof.
    <a href="https://www.ece.nus.edu.sg/gems/profhome.html" target="_blank">Dipti Srinivasan (FIEEE)</a>.
  </p>
  <p>
    Waht I do:
      - Power system stability analysis and control:
        - stability risk analysis and control considering uncertainties;
        - power electronic-dominated power system stability based on impedance modeling and analysis.
      - Data analysis for smart grid:
        - data-driven power system stability assessment;
        - trustworthy artificial intelligence theory and methods for power systems;
        - data-driven uncertainty modeling and analysis.
  </p>

